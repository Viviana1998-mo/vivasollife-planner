<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIVASOLLIFE — Money Allocation Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECE3; --paper-line:rgba(34,31,28,0.13); --ink:#221F1C; --ink-soft:rgba(34,31,28,0.62);
    --cloud:#FFFFFF; --gold:#A9843F; --gold-soft:rgba(169,132,63,0.15); --gold-text:#7A5F2C;
    --teal:#7A7264; --teal-soft:rgba(122,114,100,0.15); --rust:#7A3B3A; --rust-soft:rgba(122,59,58,0.13);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, Helvetica, Arial, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;}
  a{color:var(--teal);}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  #wrap{max-width:900px; margin:0 auto; padding:22px 16px 60px;}
  .brand{text-align:center; padding:10px 6px 26px;}
  .brand h1{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,5vw,38px); letter-spacing:5px; margin:0;}
  .brand .tagline{font-family:var(--font-mono); font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-soft); margin:8px 0 0;}

  .userbar{display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:6px 4px 4px; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}

  #nav{display:flex; gap:6px; border-bottom:2px solid var(--ink); padding:0 2px; flex-wrap:wrap;}
  .navtab{font-family:var(--font-mono); font-size:13px; background:var(--cloud); border:2px solid var(--ink); border-bottom:none; padding:10px 14px; cursor:pointer; display:flex; gap:8px; align-items:center; border-radius:6px 6px 0 0; color:var(--ink-soft); position:relative; top:2px;}
  .navtab:hover{color:var(--ink);}
  .navtab.active{background:var(--ink); color:var(--paper); top:0; z-index:2;}
  .navnum{font-weight:700;}
  .navcheck{color:var(--teal); font-weight:700;}
  .navtab.active .navcheck{color:var(--gold);}

  .step{background:var(--cloud); border:2px solid var(--ink); border-top:none; padding:28px; border-radius:0 0 10px 10px;}
  @media (max-width:600px){ .step{padding:18px;} }
  .step h2{font-family:var(--font-display); font-weight:600; font-size:22px; margin:0 0 6px; letter-spacing:0.5px;}
  .step h3{font-family:var(--font-display); font-weight:600; font-size:17px; margin:26px 0 10px;}
  .step-help{color:var(--ink-soft); font-size:14px; margin:0 0 20px; max-width:60ch;}

  .table-wrap{margin-bottom:14px; overflow-x:auto;}
  .row{display:grid; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--paper-line); min-width:480px;}
  .row-income{grid-template-columns:150px 1.6fr 1fr 32px;}
  .row-expense, .row-goal{grid-template-columns:1.3fr 1fr 1.6fr 32px;}
  .row-head{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding-bottom:8px;}
  .row input, .row select{font-family:var(--font-body); font-size:14px; padding:8px 10px; border:1.5px solid var(--paper-line); border-radius:5px; background:var(--paper); color:var(--ink); width:100%;}
  .row input:focus, .row select:focus{border-color:var(--teal); background:var(--cloud);}
  .amt{display:flex; align-items:center; gap:4px; background:var(--paper); border:1.5px solid var(--paper-line); border-radius:5px; padding:0 8px;}
  .amt:focus-within{border-color:var(--teal); background:var(--cloud);}
  .amt span{color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;}
  .amt input{border:none; background:transparent; padding:8px 0;}
  .amt input:focus{border:none;}
  .rowdel{background:none; border:none; color:var(--rust); font-size:15px; cursor:pointer; width:32px; height:32px; border-radius:50%;}
  .rowdel:hover{background:var(--rust-soft);}

  .empty{padding:26px 16px; text-align:center; color:var(--ink-soft); border:2px dashed var(--paper-line); border-radius:8px; margin-bottom:16px;}
  .empty-cell{text-align:center; color:var(--ink-soft); padding:16px !important;}

  .btn{font-family:var(--font-body); font-weight:600; font-size:14px; padding:10px 18px; border-radius:5px; border:2px solid var(--ink); cursor:pointer;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{background:#0f1a13;}
  .btn-primary:disabled{opacity:0.6; cursor:default;}
  .btn-outline{background:transparent; color:var(--ink);}
  .btn-outline:hover{background:rgba(28,43,34,0.06);}
  .btn-text{border:none; background:none; color:var(--ink-soft); text-decoration:underline; padding:6px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .btn-add{background:var(--gold-soft); border:2px dashed var(--gold); color:var(--gold-text);}
  .btn-add:hover{background:rgba(184,134,46,0.24);}

  .totalbar{font-family:var(--font-mono); font-size:14px; display:flex; justify-content:flex-end; gap:8px; padding:12px 4px 0; color:var(--ink-soft);}
  .pb-box{background:var(--paper); border:1.5px solid var(--paper-line); border-radius:6px; padding:6px 16px; margin:16px 0 4px;}
  .pb-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-family:var(--font-mono); font-size:13px;}
  .pb-row + .pb-row{border-top:1px solid var(--paper-line);}
  .pb-label{color:var(--ink-soft);}
  .pb-amt{font-weight:600;}
  .pb-amt.negative{color:var(--rust);}
  .pb-warn{font-size:10px; color:var(--rust); margin-left:8px; font-family:var(--font-body); text-transform:uppercase; letter-spacing:0.5px; border:1px solid var(--rust); border-radius:3px; padding:2px 6px; vertical-align:middle;}
  .totalbar strong{color:var(--ink); font-size:16px;}

  .stepnav{display:flex; justify-content:space-between; margin-top:22px;}
  .actionbar{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px; align-items:center;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:16px 0 26px;}
  .card{border:2px solid var(--ink); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:6px; background:var(--paper);}
  .card-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-family:var(--font-mono);}
  .card-value{font-family:var(--font-display); font-size:24px; font-weight:600;}
  .card-value em{font-style:normal; font-size:12px; color:var(--ink-soft); display:block; font-family:var(--font-mono); margin-top:3px;}
  .card-gold{background:var(--gold-soft); border-color:var(--gold);}

  .banner{display:flex; align-items:center; gap:16px; padding:14px 18px; border-left:6px solid; border-radius:6px; margin:14px 0 24px; background:var(--paper); flex-wrap:wrap;}
  .banner-ok{border-color:var(--teal);} .banner-warn{border-color:var(--gold);} .banner-error{border-color:var(--rust);}
  .banner p{margin:0; font-size:14px;}
  .stamp{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:2px; font-weight:700; font-size:12px; padding:6px 12px; border:3px double; border-radius:5px; transform:rotate(-4deg); white-space:nowrap;}
  .stamp-ok{color:var(--teal); border-color:var(--teal);}
  .stamp-warn{color:var(--gold-text); border-color:var(--gold);}
  .stamp-error{color:var(--rust); border-color:var(--rust);}

  .flowbar{display:flex; height:38px; border:2px solid var(--ink); border-radius:6px; overflow:hidden; margin-bottom:10px;}
  .seg{height:100%;} .seg-rust{background:var(--rust);} .seg-teal{background:var(--teal);} .seg-gold{background:var(--gold);}
  .pie-wrap{display:flex; align-items:center; gap:28px; flex-wrap:wrap; margin-bottom:20px;}
  .piechart{flex-shrink:0;}
  .summary-box{border:1.5px solid var(--ink); border-radius:6px; overflow:hidden; margin:4px 0 26px;}
  .pdf-block{background:var(--cloud);}
  .sum-row{display:flex; justify-content:space-between; gap:12px; padding:10px 16px; font-size:13px; border-bottom:1px solid var(--paper-line); background:var(--cloud);}
  .sum-row:last-child{border-bottom:none;}
  .sum-row.highlight{background:var(--gold-soft); font-weight:700;}
  .sum-val{font-family:var(--font-mono); font-weight:600; white-space:nowrap;}
  .flowlegend{display:flex; flex-direction:column; gap:10px; font-family:var(--font-mono); font-size:13px;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px;}
  .dot-rust{background:var(--rust);} .dot-teal{background:var(--teal);} .dot-gold{background:var(--gold);}
  .deficit{background:var(--rust-soft); border:2px solid var(--rust); padding:16px; border-radius:8px; margin-bottom:20px;}

  .table-scroll{overflow-x:auto; margin-bottom:26px;}
  table.ledger{width:100%; border-collapse:separate; border-spacing:0; font-family:var(--font-mono); font-size:13px; min-width:520px;}
  .ledger th{text-align:right; border-bottom:2px solid var(--ink); padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;}
  .ledger th:first-child, .ledger th:nth-child(2){text-align:left;}
  .ledger td{padding:8px 10px; border-bottom:1px solid var(--paper-line);}
  .ledger td.num{text-align:right;}
  .ledger tfoot td{font-weight:700; border-top:2px solid var(--ink); border-bottom:none;}
  .row-warn td{color:#8A2F18; background:var(--rust-soft);}

  #savedToast{position:fixed; bottom:18px; right:18px; background:var(--ink); color:var(--paper); font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; padding:9px 16px; border-radius:4px; opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease; pointer-events:none; text-transform:uppercase; z-index:50;}
  #savedToast.show{opacity:1; transform:translateY(0);}

  #loadingOverlay{position:fixed; inset:0; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:100; font-family:var(--font-mono); color:var(--ink-soft);}
  .loadspin{width:28px; height:28px; border:3px solid var(--paper-line); border-top-color:var(--ink); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  footer.note{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:18px; font-family:var(--font-mono);}

  /* auth screen */
  .authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .authcard{background:var(--cloud); border:2px solid var(--ink); border-radius:10px; padding:34px; max-width:380px; width:100%;}
  .authcard .brand{padding:0 0 22px;}
  .authtabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:2px solid var(--paper-line);}
  .authtab{flex:1; background:none; border:none; padding:10px; font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;}
  .authtab.active{color:var(--ink); border-bottom-color:var(--teal);}
  #authForm label{display:block; font-size:12px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin-bottom:14px;}
  #authForm input{display:block; width:100%; margin-top:6px; padding:10px 12px; border:1.5px solid var(--paper-line); border-radius:5px; background:var(--paper); font-family:var(--font-body); font-size:14px;}
  #authForm input:focus{border-color:var(--teal); background:var(--cloud);}
  #authForm button{width:100%; margin-top:6px;}
  .autherror{color:var(--rust); font-size:13px; margin-bottom:12px;}
  .authnotice{color:var(--teal); font-size:13px; margin-bottom:12px;}

  @media print{
    #nav, .actionbar, footer.note, #savedToast, .userbar{display:none !important;}
    body{background:#fff;} .step{border:none; padding:0;}
  }
</style>
</head>
<body>

<div id="loadingOverlay"><div class="loadspin"></div><p>Opening your ledger…</p></div>

<div id="authScreen" class="authwrap" style="display:none;">
  <div class="authcard">
    <header class="brand"><h1>VIVASOLLIFE</h1><p class="tagline">Money Allocation Planner</p></header>
    <div class="authtabs">
      <button type="button" class="authtab active" data-authtab="signin">Sign in</button>
      <button type="button" class="authtab" data-authtab="signup">Create account</button>
    </div>
    <form id="authForm">
      <label>Email<input type="email" id="authEmail" required autocomplete="email" /></label>
      <label>Password<input type="password" id="authPassword" required minlength="6" autocomplete="current-password" /></label>
      <div id="authError" class="autherror"></div>
      <div id="authNotice" class="authnotice"></div>
      <button type="submit" class="btn btn-primary" id="authSubmit">Sign in</button>
    </form>
  </div>
</div>

<div id="wrap" style="display:none;">
  <div class="userbar"><span id="userEmail"></span><button class="btn-text" id="logoutBtn">Log out</button></div>
  <header class="brand"><h1>VIVASOLLIFE</h1><p class="tagline">Money Allocation Planner</p></header>
  <nav id="nav"></nav>
  <main id="stepContainer"></main>
  <footer class="note">Your numbers are saved to your account — sign in from any device to see them.</footer>
</div>

<div id="savedToast">Saved</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){
  "use strict";

  // =========================================================
  // 1) FILL THESE TWO IN before you deploy — see SETUP_GUIDE.md
  //    Both come from Supabase → Project Settings → API.
  //    The anon/public key is DESIGNED to be visible in client code.
  //    Never put your "service_role" key here.
  // =========================================================
  var SUPABASE_URL = 'https://cusyiuaztcvwkhlgexdp.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1c3lpdWF6dGN2d2tobGdleGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjU2NTksImV4cCI6MjEwMTgwMTY1OX0.fOQ4WGVNbIXzmCyH8GztJEBSYR193EsojY4JYq5dfHU';

  var setupProblem = null;
  var supabaseClient = null;

  if(!SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0 || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE') === 0){
    setupProblem = 'keys';
  } else if(!window.supabase || !window.supabase.createClient){
    setupProblem = 'script-blocked';
  } else {
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(e){
      console.error('Supabase init failed', e);
      setupProblem = 'invalid-keys';
    }
  }

  function showSetupScreen(kind){
    var messages = {
      'keys': ['Setup needed', 'This planner needs your Supabase project URL and anon key before it can run. Open this file in a text editor, find the two placeholder lines near the top of the &lt;script&gt; section, and replace them with the values from your Supabase project (Settings &rarr; API). See SETUP_GUIDE.md for the exact steps.'],
      'invalid-keys': ['Couldn\'t connect', 'The Supabase URL or key in this file doesn\'t look right. Double-check you copied the full Project URL and anon/public key from Supabase &rarr; Settings &rarr; API, with no extra spaces or quotes left in.'],
      'script-blocked': ['Couldn\'t load required script', 'This page couldn\'t load the Supabase library. If you\'re viewing this inside Claude\'s file preview, that\'s expected \u2014 Claude\'s preview only allows scripts from a limited set of sources. Deploy this file to your live hosting (e.g. Netlify) and open it from that URL instead \u2014 it will load correctly there.']
    };
    var m = messages[kind] || messages['keys'];
    loadingOverlay.innerHTML =
      '<div style="max-width:420px; text-align:center; padding:0 24px;">' +
        '<p style="font-family:\'IBM Plex Mono\',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7A3B3A; margin-bottom:12px;">'+m[0]+'</p>' +
        '<p style="font-family:\'IBM Plex Sans\',sans-serif; font-size:14px; color:#221F1C; line-height:1.65; margin:0;">'+m[1]+'</p>' +
      '</div>';
    loadingOverlay.style.display = 'flex';
  }

  var state = { income: [], expenses: [], goals: [] };
  var currentStep = 'income';
  var currentUser = null;

  var loadingOverlay = document.getElementById('loadingOverlay');
  var authScreen = document.getElementById('authScreen');
  var appWrap = document.getElementById('wrap');
  var nav = document.getElementById('nav');
  var stepContainer = document.getElementById('stepContainer');

  // ---------- utilities ----------
  function uid(){ return 'r' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function fmtMoney(n){
    n = Number(n) || 0;
    var neg = n < -0.004;
    var abs = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    return (neg ? '-$' : '$') + abs;
  }
  function fmtDate(dateStr){
    if(!dateStr) return '—';
    var parts = dateStr.split('-').map(Number);
    if(!parts[0]) return '—';
    var dt = new Date(parts[0], parts[1]-1, parts[2]);
    if(isNaN(dt.getTime())) return '—';
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }
  function numOr0(v){ var f = parseFloat(v); return isNaN(f) ? 0 : f; }
  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  // ---------- Supabase-backed storage ----------
  async function loadState(){
    if(!currentUser) return;
    try{
      var res = await supabaseClient.from('planner_data').select('payload').eq('user_id', currentUser.id).maybeSingle();
      if(res.data && res.data.payload){
        state.income = Array.isArray(res.data.payload.income) ? res.data.payload.income : [];
        state.expenses = Array.isArray(res.data.payload.expenses) ? res.data.payload.expenses : [];
        state.goals = Array.isArray(res.data.payload.goals) ? res.data.payload.goals : [];
      }
    }catch(e){ console.error('Load failed', e); }
  }

  async function saveState(){
    if(!currentUser) return;
    try{
      var res = await supabaseClient.from('planner_data').upsert({
        user_id: currentUser.id, payload: state, updated_at: new Date().toISOString()
      });
      if(!res.error) showSavedIndicator();
      else console.error('Save failed', res.error);
    }catch(e){ console.error('Save failed', e); }
  }
  var saveStateDebounced = debounce(saveState, 500);

  var toastTimer;
  function showSavedIndicator(){
    var t = document.getElementById('savedToast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1100);
  }

  // ---------- derived data ----------
  function sumIncome(){ return state.income.reduce(function(s,r){ return s + numOr0(r.amount); }, 0); }
  function sumExpenses(){ return state.expenses.reduce(function(s,r){ return s + numOr0(r.amount); }, 0); }
  function sumGoalsRequested(){ return state.goals.reduce(function(s,r){ return s + numOr0(r.amount); }, 0); }

  function polarToCartesian(cx, cy, r, angleDeg){
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function pieArcPath(cx, cy, r, startAngle, endAngle){
    var start = polarToCartesian(cx, cy, r, startAngle);
    var end = polarToCartesian(cx, cy, r, endAngle);
    var largeArcFlag = (endAngle - startAngle) > 180 ? 1 : 0;
    return ['M', cx, cy, 'L', start.x.toFixed(2), start.y.toFixed(2), 'A', r, r, 0, largeArcFlag, 1, end.x.toFixed(2), end.y.toFixed(2), 'Z'].join(' ');
  }

  function computeDashboard(){
    var totalIncome = sumIncome();
    var totalExpenses = sumExpenses();
    var balance = totalIncome - totalExpenses;
    var goalsRequestedTotal = sumGoalsRequested();
    var scaleFactor;
    if(goalsRequestedTotal === 0) scaleFactor = 1;
    else if(balance <= 0) scaleFactor = 0;
    else scaleFactor = Math.min(1, balance / goalsRequestedTotal);
    var goalsAllocatedTotal = goalsRequestedTotal * scaleFactor;
    var guiltFree = balance - goalsAllocatedTotal;

    var statusType, statusMessage, stampText;
    if(balance < 0){ statusType='error'; statusMessage='Your necessary expenses are more than your income this month.'; stampText='Short'; }
    else if(scaleFactor < 1){ statusType='warn'; statusMessage='Your goals were scaled down proportionally to fit your budget this month.'; stampText='Scaled'; }
    else { statusType='ok'; statusMessage='All your goals are fully funded this month.'; stampText='Funded'; }

    var paydayRows = state.income.map(function(inc){
      var expensesDue = state.expenses.filter(function(e){ return e.paycheckId === inc.id; }).reduce(function(s,e){ return s+numOr0(e.amount); },0);
      var goalsFunded = state.goals.filter(function(g){ return g.paycheckId === inc.id; }).reduce(function(s,g){ return s+numOr0(g.amount); },0) * scaleFactor;
      var leftover = numOr0(inc.amount) - expensesDue - goalsFunded;
      return { date: inc.date, source: inc.source, amount: numOr0(inc.amount), expensesDue: expensesDue, goalsFunded: goalsFunded, leftover: leftover };
    });

    var goalRows = state.goals.map(function(g){
      var monthly = numOr0(g.amount) * scaleFactor;
      return { name: g.name, monthly: monthly, sixMonths: monthly*6, oneYear: monthly*12 };
    });

    return { totalIncome:totalIncome, totalExpenses:totalExpenses, balance:balance, goalsRequestedTotal:goalsRequestedTotal,
      scaleFactor:scaleFactor, goalsAllocatedTotal:goalsAllocatedTotal, guiltFree:guiltFree, statusType:statusType,
      statusMessage:statusMessage, stampText:stampText, paydayRows:paydayRows, goalRows:goalRows };

  document.addEventListener('click', function(e){
    var addIncome = e.target.closest('[data-action="add-income"]');
    if(addIncome){ state.income.push({id:uid(), date:'', source:'', amount:''}); saveStateDebounced(); renderAll(); return; }
    var addExpense = e.target.closest('[data-action="add-expense"]');
    if(addExpense){ state.expenses.push({id:uid(), category:'', amount:'', paycheckId:''}); saveStateDebounced(); renderAll(); return; }
    var addGoal = e.target.closest('[data-action="add-goal"]');

  // ---------- PDF export ----------
  async function downloadPDF(btn){
    var original = btn.textContent; btn.textContent = 'Preparing PDF…'; btn.disabled = true;
    try{
      var container = document.getElementById('dashboard-capture');
      var blocks = container.querySelectorAll('.pdf-block');
      var jsPDFCtor = window.jspdf.jsPDF;
      var pdf = new jsPDFCtor('p','pt','a4');
      var pageWidth = pdf.internal.pageSize.getWidth();
      var pageHeight = pdf.internal.pageSize.getHeight();
      var margin = 28;
      var usableWidth = pageWidth - margin*2;
      var y = margin;

      for(var i=0;i<blocks.length;i++){
        var canvas = await html2canvas(blocks[i], {
          scale:2,
          backgroundColor:'#FFFFFF',
          onclone: function(clonedDoc){
            var scrolls = clonedDoc.querySelectorAll('.table-scroll');
            for(var j=0;j<scrolls.length;j++){ scrolls[j].style.overflow = 'visible'; }
          }
        });
        var imgData = canvas.toDataURL('image/png');
        var imgHeight = canvas.height * usableWidth / canvas.width;

        // Start a new page if this block won't fit in the remaining space
        if(y > margin && (y + imgHeight) > (pageHeight - margin)){
          pdf.addPage();
          y = margin;
        }

        // If a single block is taller than a whole page (rare: very long table),
        // place it at the top of a fresh page rather than force it into a partial gap.
        if(imgHeight > (pageHeight - margin*2) && y > margin){
          pdf.addPage();
          y = margin;
        }

        pdf.addImage(imgData, 'PNG', margin, y, usableWidth, imgHeight);
        y += imgHeight + 16;
      }

      pdf.save('vivasollife-money-plan.pdf');
    }catch(err){ console.error('PDF export failed', err); alert('The PDF could not be generated. Please try again.'); }
    finally{ btn.textContent = original; btn.disabled = false; }
  }

    authSubmit.disabled = true;

      if(authMode==='signin'){
        var res = await supabaseClient.auth.signInWithPassword({email:email, password:password});
        if(res.error){ authError.textContent = res.error.message; }

      } else {
        var res2 = await supabaseClient.auth.signUp({email:email, password:password});
        if(res2.error){ authError.textContent = res2.error.message; }

    await loadState();
    currentStep = (state.income.length>0) ? 'dashboard' : 'income';
    loadingOverlay.style.display = 'none';
    authScreen.style.display = 'none';
    appWrap.style.display = 'block';
    renderAll();
  }

  // ---------- init & auth state ----------
  if(setupProblem){
    showSetupScreen(setupProblem);
  } else {
    supabaseClient.auth.onAuthStateChange(function(event, session){
      if(session && session.user){
        showApp(session.user);
      } else {
        currentUser = null;
        state = {income:[], expenses:[], goals:[]};
        showAuthScreen();
      }
    });

    (async function init(){
      try{
        var res = await supabaseClient.auth.getSession();
        if(res.data && res.data.session && res.data.session.user){
          await showApp(res.data.session.user);
        } else {
          showAuthScreen();
        }
      }catch(e){
        console.error('Could not reach Supabase', e);
        showSetupScreen('invalid-keys');
      }
    })();
  }

})();
</script>
</body>
</html>
